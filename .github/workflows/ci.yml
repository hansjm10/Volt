name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-check-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -sf "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Require changesets for product changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "refs/heads/${BASE_REF}"
          node scripts/check-changesets.mjs --require --base FETCH_HEAD

      - name: Test
        env:
          VOLT_TEST_REQUIRE_NATIVE_IROH: '1'
        run: npm test

      - name: Test Iroh enrollment transactions in Firestore emulator
        timeout-minutes: 10
        run: |
          npm --prefix packages/coding-agent/examples/remote/firebase-push-relay/functions ci --ignore-scripts
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://github.com/firebase/firebase-tools/releases/download/v15.26.0/firebase-tools-linux \
            --output /tmp/firebase-tools
          echo 'd6eb340cb4f06dcf5a3015ff588d826ab3bdce75b25855a25866af182417afe7  /tmp/firebase-tools' | sha256sum --check
          chmod +x /tmp/firebase-tools
          cd packages/coding-agent/examples/remote/firebase-push-relay/functions
          /tmp/firebase-tools emulators:exec --config ../firebase.emulator.json --project demo-volt-iroh-enrollment --only firestore "$(command -v node) --test enrollment-emulator.integration.js"

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install system dependencies
        run: choco install fd ripgrep --no-progress -y

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test
        shell: bash
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          VITEST_MAX_FORKS: '2'
        run: ./test.sh
