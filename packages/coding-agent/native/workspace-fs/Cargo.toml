[package]
name = "volt-workspace-fs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
cap-std = "=4.0.2"
napi = { version = "=3.12.1", default-features = false, features = ["dyn-symbols", "napi8"] }
napi-derive = { version = "=3.6.3", default-features = false, features = ["strict"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }

[build-dependencies]
napi-build = "=2.4.1"
sha2 = "=0.11.0"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"
